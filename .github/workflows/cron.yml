# ============================================================================
# The automation heartbeat.
#
# ClaimReach's automation engine was fully built and had never run: the queue,
# the executor and /api/cron/automations all existed, but nothing on a schedule
# ever called them, so every queued step sat pending forever and automations
# looked broken in the hardest way to diagnose — silently.
#
# Cloudflare Pages has no native cron, so the schedule lives here. GitHub runs
# this every 5 minutes and pings the drain endpoints.
#
# SETUP (one time) — the SAME value on both sides:
#   GitHub:  Settings → Secrets and variables → Actions → CRON_SECRET
#   Cloudflare Pages (production): Settings → Environment variables → CRON_SECRET
#   Then redeploy production. A new env var is not live until the next deploy.
#
# Routes validate the x-cron-secret HEADER (not a query param).
#
# Note: GitHub's scheduler can drift by a few minutes under load. That is fine
# for a 10-minute undo window; it is not a hard real-time guarantee.
# ============================================================================
name: ClaimReach automation heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you fire it by hand to test

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Require CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is empty. Set it in GitHub (Settings → Secrets and variables → Actions) AND in Cloudflare Pages production env, then redeploy. Values must match."
            exit 1
          fi

      - name: Drain the automation queue
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS \
            -H "x-cron-secret: $CRON_SECRET" \
            https://claimreach.com/api/cron/automations

      - name: Run due drips
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS \
            -H "x-cron-secret: $CRON_SECRET" \
            https://claimreach.com/api/cron/drips

  # Same schedule as drain. Public GET — no CRON_SECRET.
  # Same live/offline rule as crissiBrainFromHealth in src/lib/ai.ts:
  # LIVE = non-empty direct.answer OR viaProxy.answer. HTTP 200 is not health.
  # A GitHub network blip retries once and does not fail the run.
  crissi-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check Crissi brain
        run: |
          set +e
          fetch_health() {
            curl -sS --max-time 20 -o /tmp/crissi-health.json -w "%{http_code}" \
              "https://claimreach.com/api/ai?health=1"
          }
          code=$(fetch_health)
          curl_ok=$?
          if [ $curl_ok -ne 0 ]; then
            echo "first health fetch failed (curl $curl_ok); retrying once"
            sleep 2
            code=$(fetch_health)
            curl_ok=$?
            if [ $curl_ok -ne 0 ]; then
              echo "::warning::GitHub could not reach claimreach.com — not treating as Crissi down"
              exit 0
            fi
          fi
          echo "HTTP $code"
          python3 - <<'PY'
          import json, sys
          try:
              data = json.load(open("/tmp/crissi-health.json"))
          except Exception as e:
              print("::error::health JSON unreadable:", e)
              sys.exit(1)
          direct = data.get("direct") or {}
          proxy = data.get("viaProxy") or {}
          da = (direct.get("answer") or "").strip() if isinstance(direct, dict) else ""
          pa = (proxy.get("answer") or "").strip() if isinstance(proxy, dict) else ""
          err = direct.get("error") if isinstance(direct, dict) else None
          print("direct.answer:", repr(da))
          print("viaProxy.answer:", repr(pa))
          print("direct.error:", err)
          if not da and not pa:
              print(f"::error::Crissi offline — both answers empty (direct.error={err})")
              sys.exit(1)
          print("Crissi live")
          PY
